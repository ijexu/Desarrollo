<!DOCTYPE html>
<html>
	<head>
		<link rel="stylesheet" href="register.css">
	</head>
	<body>

		<div class="bloqueprincipal">
			<div class="bloqueform">

		<form action="/registro" 
			method="post" 
			class="registerform">
			<h1> Registrate en Kastcino </h1>
			<label for="text"><b>Nombre completo</b></label>
			<input type="nombre"
			       id="nombre" 
			       name="nombre" 
			       required>
			<label for="edad"> <b>  Edad </b> </label> 
			<input type="number" 
			       id="edad" 
			       name="edad"
			       max="18" required>
			<label for="correo"> <b>Correo electronico</b></label>
			<input type="email"
			       id="correo"
			       name="correo" required>
			<label for="contrasena"> <b>Contraseña</b> </label>
			<input type="password"
			       id="contrasena"
			       name="contrasena" required>
		<button class="crearcuenta"><b>Crear Cuenta </b></button>
		</form>
		</div>

		<div class="bloqueimagen">
		</div>
		</div>
		</body>
</html>
